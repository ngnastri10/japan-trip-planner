<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Japan Trip Planner</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗾</text></svg>">

<!-- Leaflet map library (free, no API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ?v= is a cache-buster: niconastri.com sits behind Cloudflare, which caches
     static files for hours per edge location. Bump this number any time a
     CSS change needs to show up immediately instead of waiting on that. -->
<link rel="stylesheet" href="css/style.css?v=7">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <span class="logo">🗾</span>
    <h1 id="trip-title">Japan Trip Planner</h1>
  </div>
  <nav class="city-nav">
    <button class="city-btn" data-city="tokyo">Tokyo</button>
    <button class="city-btn" data-city="kyoto">Kyoto</button>
    <button class="city-btn" data-city="osaka">Osaka</button>
    <button class="city-btn" data-city="seoul">Seoul</button>
    <button class="city-btn" data-city="busan">Busan</button>
  </nav>
  <nav class="tabs">
    <button class="tab-btn active" data-view="map">Map</button>
    <button class="tab-btn" data-view="list">List</button>
    <button class="tab-btn" data-view="itinerary">Itinerary</button>
  </nav>
  <div class="header-right">
    <button id="whoami-btn" class="whoami-btn">👤 <span id="whoami-name">set name</span></button>
  </div>
</header>

<main>

  <!-- MAP VIEW -->
  <section id="view-map" class="view active">
    <div class="map-toolbar">
      <div class="search-wrap">
        <input id="place-search" type="text" placeholder="Search a place in Japan (e.g. Fushimi Inari Shrine)…" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="filter-wrap">
        <button type="button" id="cat-filter-btn" class="cat-filter-btn">
          <span id="cat-filter-label">All categories</span> ▾
        </button>
        <div id="cat-filter-panel" class="cat-filter-panel hidden"></div>
      </div>
      <label class="nbhd-toggle">
        <input type="checkbox" id="toggle-neighborhoods" checked>
        Neighborhoods
      </label>
    </div>
    <div id="map"></div>
    <button id="fab-add" class="fab" title="Add a place">+</button>
  </section>

  <!-- LIST VIEW -->
  <section id="view-list" class="view">
    <div class="list-toolbar">
      <select id="list-filter-city">
        <option value="">All cities</option>
        <option value="tokyo">Tokyo</option>
        <option value="kyoto">Kyoto</option>
        <option value="osaka">Osaka</option>
        <option value="seoul">Seoul</option>
        <option value="busan">Busan</option>
      </select>
      <select id="list-filter-category">
        <option value="">All categories</option>
        <option value="food">🍜 Food</option>
        <option value="cafe">☕ Café / Tea</option>
        <option value="bar">🍸 Bar</option>
        <option value="temple">🏯 Temple / Shrine</option>
        <option value="nature">🌳 Nature / Park</option>
        <option value="shopping">🛍️ Shopping</option>
        <option value="culture">🎌 Culture / Museum</option>
        <option value="activity">🧭 Activity / Sights</option>
        <option value="other">📍 Other</option>
      </select>
      <select id="list-sort">
        <option value="votes">Sort: most 👍 first</option>
        <option value="newest">Sort: newest first</option>
        <option value="name">Sort: name (A–Z)</option>
      </select>
      <button id="list-add-btn" class="btn-primary">+ Add a place</button>
    </div>
    <div id="place-list" class="place-list"></div>
  </section>

  <!-- ITINERARY VIEW -->
  <section id="view-itinerary" class="view">
    <div class="list-toolbar">
      <select id="itinerary-filter-city">
        <option value="">All cities</option>
        <option value="tokyo">Tokyo</option>
        <option value="kyoto">Kyoto</option>
        <option value="osaka">Osaka</option>
        <option value="seoul">Seoul</option>
        <option value="busan">Busan</option>
      </select>
    </div>
    <div id="itinerary-board" class="itinerary-board"></div>
  </section>

</main>

<!-- ADD / EDIT PLACE MODAL -->
<div id="place-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 id="place-modal-title">Add a place</h2>
    <form id="place-form">
      <label>Got a Google Maps link? Paste it to auto-fill the location
        <input type="text" id="pf-gmaps-link" placeholder="https://maps.google.com/...">
      </label>
      <div id="pf-gmaps-status" class="gmaps-status hidden"></div>
      <label>Name
        <input type="text" id="pf-name" required placeholder="e.g. Fushimi Inari Shrine">
      </label>
      <label>City
        <select id="pf-city">
          <option value="">Unassigned</option>
          <option value="tokyo">Tokyo</option>
          <option value="kyoto">Kyoto</option>
          <option value="osaka">Osaka</option>
          <option value="seoul">Seoul</option>
          <option value="busan">Busan</option>
        </select>
      </label>
      <label>Category
        <select id="pf-category">
          <option value="food">🍜 Food</option>
          <option value="cafe">☕ Café / Tea</option>
          <option value="bar">🍸 Bar</option>
          <option value="temple">🏯 Temple / Shrine</option>
          <option value="nature">🌳 Nature / Park</option>
          <option value="shopping">🛍️ Shopping</option>
          <option value="culture">🎌 Culture / Museum</option>
          <option value="activity">🧭 Activity / Sights</option>
          <option value="other">📍 Other</option>
        </select>
      </label>
      <label>Notes
        <textarea id="pf-notes" rows="3" placeholder="Why do we want to go? Anything to know?"></textarea>
      </label>
      <label>Proposed date (optional)
        <input type="date" id="pf-date">
      </label>
      <div class="coord-row">
        <span id="pf-coords-display">📍 Click the map, or search above, to set location</span>
      </div>
      <input type="hidden" id="pf-lat">
      <input type="hidden" id="pf-lng">
      <div class="modal-actions">
        <button type="button" id="place-modal-cancel" class="btn-secondary">Cancel</button>
        <button type="button" id="place-modal-delete" class="btn-danger hidden">Delete</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- WHO AM I MODAL -->
<div id="whoami-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>Who's planning? 👋</h2>
    <p class="modal-sub">Enter your name so your 👍 votes and additions are attributed to you. This is remembered only on this device.</p>
    <form id="whoami-form">
      <label>Your name
        <input type="text" id="whoami-input" required placeholder="e.g. Mom, Dad, Nico…">
      </label>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">Let's go</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/main.js?v=7"></script>
</body>
</html>
